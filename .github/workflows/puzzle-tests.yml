name: Puzzle logic tests

on:
  pull_request:
    paths:
      - "core.js"
      - "game.js"
      - "sw.js"
      - "index.html"
      - "styles.css"
      - "tests/**"
      - ".github/workflows/puzzle-tests.yml"
  push:
    branches: [main]
    paths:
      - "core.js"
      - "game.js"
      - "sw.js"
      - "index.html"
      - "styles.css"
      - "tests/**"
      - ".github/workflows/puzzle-tests.yml"

jobs:
  logic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check
        run: |
          node --check core.js
          node --check game.js
          node --check sw.js
      - name: Level and collision regression tests
        run: node --test tests/*.test.cjs
