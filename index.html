<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F3EEE3">
  <meta name="description" content="Arrow Cube Away — turn a glass cube, find the arrows with a clear lane, and tap them out in the right order. 15 logic puzzles, offline.">
  <title>Arrow Cube Away — 3D Puzzle</title>
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="preload" href="./fonts/InstrumentSans-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="./fonts/InstrumentSerif-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="./styles.css">
  <script defer src="./core.js"></script>
  <script defer src="./game.js"></script>
</head>
<body>
  <div class="app">
    <header class="bar">
      <button class="icon-button" id="menuBtn" aria-label="Choose a level" title="Levels">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="4" y="4" width="6" height="6" rx="1.2"/><rect x="14" y="4" width="6" height="6" rx="1.2"/><rect x="4" y="14" width="6" height="6" rx="1.2"/><rect x="14" y="14" width="6" height="6" rx="1.2"/></svg>
      </button>
      <div class="bar-title">
        <div class="eyebrow"><span id="difficultyTag" class="difficulty-tag easy">EASY</span><span class="dot" aria-hidden="true"></span><span id="levelFraction">01 / 15</span></div>
        <h1 id="levelTitle"><em>Level</em> 01</h1>
      </div>
      <div class="bar-actions">
        <button class="icon-button" id="soundBtn" aria-label="Mute sounds" title="Sound">
          <svg class="speaker-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4Z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>
          <svg class="speaker-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4Z"/><path d="m16 9.5 5 5m0-5-5 5"/></svg>
        </button>
        <button class="icon-button" id="settingsBtn" aria-label="Settings" title="Settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M5 7h9M18 7h1M5 17h1M10 17h9"/><circle cx="16" cy="7" r="2.1"/><circle cx="8" cy="17" r="2.1"/></svg>
        </button>
      </div>
    </header>

    <section class="meter" aria-label="Progress">
      <div class="hearts" id="hearts" aria-label="3 hearts remaining"></div>
      <div class="progress-track" role="progressbar" id="progressTrack" aria-label="Arrows cleared" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"><div class="progress-fill" id="progressFill"></div></div>
      <div class="remaining"><strong id="remainingCount">0</strong><span>left</span></div>
    </section>

    <main class="stage" id="stage" aria-label="3D puzzle game">
      <canvas id="gameCanvas" aria-label="Rotatable glass cube covered in arrows. Drag to rotate. Tap an arrow to release it." tabindex="0"></canvas>
      <div class="stage-note"><span id="stageNote">DRAG TO TURN · TAP AN ARROW</span></div>
      <div class="stage-toast" id="toast" role="status" aria-live="polite"></div>
    </main>

    <nav class="dock" aria-label="Game controls">
      <button class="dock-button" id="rotateLeftBtn" title="Turn the cube left">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 7 5 11l4 4"/><path d="M5 11h8a6 6 0 0 1 6 6v1"/></svg><span>Left</span>
      </button>
      <button class="dock-button" id="rotateRightBtn" title="Turn the cube right">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m15 7 4 4-4 4"/><path d="M19 11h-8a6 6 0 0 0-6 6v1"/></svg><span>Right</span>
      </button>
      <button class="dock-button" id="lanesBtn" aria-pressed="false" title="Show every arrow's exit lane">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h13M14 5l3 3-3 3"/><path d="M4 16h8" stroke-dasharray="2 3"/><path d="M4 12h16" opacity=".35"/></svg><span>Lanes</span>
      </button>
      <button class="dock-button" id="resetBtn" title="Restart this level">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12a7 7 0 1 0 2.3-5.2"/><path d="M5 5v4h4"/></svg><span>Restart</span>
      </button>
      <button class="dock-button dock-primary" id="hintBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3Z"/></svg><span>Hint</span>
      </button>
    </nav>
  </div>

  <!-- Level sheet -->
  <div class="sheet-backdrop hidden" id="sheet" role="presentation">
    <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <header class="sheet-head">
        <div><div class="eyebrow">YOUR JOURNEY · <span id="statSolved">00</span> / 15 SOLVED</div><h2 id="sheetTitle">Choose a level</h2></div>
        <button class="icon-button" id="sheetClose" aria-label="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="m6 6 12 12M18 6 6 18"/></svg>
        </button>
      </header>
      <div class="tier-heading"><span class="tier-marker easy"></span>EASY<span>01 — 05</span></div>
      <div class="level-grid" id="easyLevels"></div>
      <div class="tier-heading"><span class="tier-marker medium"></span>MEDIUM<span>06 — 10</span></div>
      <div class="level-grid" id="mediumLevels"></div>
      <div class="tier-heading"><span class="tier-marker hard"></span>HARD<span>11 — 15</span></div>
      <div class="level-grid" id="hardLevels"></div>
      <p class="sheet-foot">An arrow can leave when the line in front of its head is empty. Offline, no accounts.</p>
    </section>
  </div>

  <!-- Dialogs -->
  <div class="modal-backdrop hidden" id="modal" role="presentation"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><button class="icon-button modal-close" id="modalClose" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="m6 6 12 12M18 6 6 18"/></svg></button><div id="modalIcon" class="modal-icon">✦</div><div id="modalEyebrow" class="modal-eyebrow">PUZZLE COMPLETE</div><h2 id="modalTitle">Level cleared!</h2><p id="modalMessage">Well played.</p><div id="modalStats" class="modal-stats"></div><div id="modalExtra"></div><div class="modal-buttons" id="modalButtons"></div></div></div>
  <script>if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) { window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {})); }</script>
</body>
</html>
